name: zenjigo_riders
description: ZenjiGO Rider - Premium Ride Hailing App for Zanzibar
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  pin_code_fields: ^8.0.1
  country_code_picker: ^3.0.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  flutter_spinkit: ^5.2.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  flutter_slidable: ^3.1.1
  emoji_picker_flutter: ^3.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  uuid: ^4.5.1
  timeago: ^3.7.0
  confetti: ^0.7.0
  flip_card: ^0.7.0
  glassmorphism: ^3.0.0
  animate_do: ^3.3.4
  page_transition: ^2.1.0
  fluttertoast: ^8.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/images/
