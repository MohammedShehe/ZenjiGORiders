include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    avoid_print: false

analyzer:
  errors:
    # Flutter's SDK now flags `package:flutter/material.dart` itself as deprecated
    # (in favour of material_ui). Every file imports it, so until the project migrates
    # packages this single diagnostic would fail CI on all ~60 files.
    deprecated_member_use: ignore
